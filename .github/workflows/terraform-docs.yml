name: Terraform Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'modules/**'
  workflow_dispatch:

jobs:
  docs:
    name: Generate module docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Generate per-module READMEs
        uses: terraform-docs/gh-actions@v1
        with:
          find-dir: modules/**
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Import signing key and configure git
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ~/.ssh/ci_signing_key
          chmod 600 ~/.ssh/ci_signing_key
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/ci_signing_key
          git config commit.gpgsign true

      - name: Commit and push README
        run: |
          git config user.name 'agent-walkllc'
          git config user.email 'agent-walkllc@users.noreply.github.com'
          git add modules/*/README.md
          git diff --cached --quiet || git commit -m 'chore: auto-update module docs'
          git push
