name: Terraform Deploy - Test Environment

on:
  push:
    branches:
      - main
    paths:
      - 'environments/test/**'
      - 'modules/**'
      - '.github/workflows/terraform-deploy-test.yml'
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  EXPECTED_AWS_ACCOUNT_ID: '874186497092'
  AWS_REGION: 'us-east-1'
  GITHUB_ACTIONS_ROLE_NAME: 'GitHubActionsServiceRole-Terraform'
  ENVIRONMENT: test
  TF_WORKING_DIR: environments/test
  TF_STATE_BUCKET: 'terraform-state-874186497092-us-east-1'

jobs:
  tflint:
    name: TFLint Scan
    uses: ./.github/workflows/tflint-scan.yml

  checkov:
    name: Checkov Security Scan
    uses: ./.github/workflows/checkov-scan.yml
    with:
      working_directory: 'environments/test'
      soft_fail: false

  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    needs: [tflint, checkov]

    defaults:
      run:
        working-directory: 'environments/test'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-check
    if: github.event_name == 'pull_request_target'

    defaults:
      run:
        working-directory: 'environments/test'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.EXPECTED_AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_ACTIONS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-Plan-Test

      - name: Validate assumed account mapping
        run: |
          ACTUAL_ACCOUNT_ID=874186497092
          if [[ "" != "874186497092" ]]; then
            echo "Expected account 874186497092, but assumed ."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary
        continue-on-error: true

      - name: Save Plan Artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: terraform-plan-artifact
          path: ${{ env.TF_WORKING_DIR }}/tfplan.binary
          retention-days: 1

  plan-comment:
    name: Post Plan Comment
    needs: terraform-plan
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/terraform-plan-pr-comment.yml
    with:
      planfile: tfplan.binary
      working-directory: 'environments/test'
      aws-region: us-east-1
      environment: test

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: test

    defaults:
      run:
        working-directory: 'environments/test'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.EXPECTED_AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_ACTIONS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-Apply-Test

      - name: Validate assumed account mapping
        run: |
          ACTUAL_ACCOUNT_ID=874186497092
          if [[ "" != "874186497092" ]]; then
            echo "Expected account 874186497092, but assumed ."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/test/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Terraform Output
        if: success()
        run: |
          echo "### Terraform Outputs :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deployment Status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment to test environment successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deployment to test environment failed!" >> $GITHUB_STEP_SUMMARY
          fi
